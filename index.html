<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Inventario de Pedidos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%2325405a'/%3E%3Ctext x='50' y='66' font-size='58' text-anchor='middle' fill='white' font-family='Arial'%3E%F0%9F%93%8B%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="app-header">
  <h1>Inventario de Pedidos</h1>
  <p class="app-subtitle">Marca lo que hay que pedir y genera el PDF para la sección de pedidos</p>
</header>

<section class="order-header">
  <div class="field">
    <label for="f-sucursal">Sucursal / Local</label>
    <input type="text" id="f-sucursal" placeholder="Ej: Local Centro">
  </div>
  <div class="field">
    <label for="f-solicitante">Solicitado por</label>
    <input type="text" id="f-solicitante" placeholder="Tu nombre">
  </div>
  <div class="field">
    <label for="f-fecha">Fecha</label>
    <input type="date" id="f-fecha">
  </div>
  <div class="field field-wide">
    <label for="f-observaciones">Observaciones</label>
    <textarea id="f-observaciones" rows="2" placeholder="Notas para el pedido (opcional)"></textarea>
  </div>
</section>

<nav class="tab-bar">
  <button type="button" class="tab-btn active" data-tab="rieles">Guías y Rieles</button>
  <button type="button" class="tab-btn" data-tab="barras">Barras</button>
  <button type="button" class="tab-btn" data-tab="otros">Otros <span id="badge-otros" class="badge">0</span></button>
</nav>

<div class="toolbar">
  <input type="search" id="search-input" placeholder="Buscar producto, color, categoría...">
  <label class="check-label">
    <input type="checkbox" id="only-marked">
    Ver solo marcados
  </label>
</div>

<main>
  <section id="panel-rieles" class="tab-panel active">
    <div id="panel-rieles-list" class="item-list"></div>
  </section>

  <section id="panel-barras" class="tab-panel">
    <div id="panel-barras-list" class="item-list"></div>
  </section>

  <section id="panel-otros" class="tab-panel">
    <form id="otro-form" class="otro-form">
      <input type="text" id="otro-cat" placeholder="Categoría (opcional)">
      <input type="text" id="otro-prod" placeholder="Producto *" required>
      <input type="text" id="otro-color" placeholder="Color (opcional)">
      <input type="number" id="otro-cant" placeholder="Cant. *" min="1" required>
      <button type="submit">Agregar</button>
    </form>
    <div id="otros-list" class="item-list"></div>
  </section>
</main>

<footer class="action-bar">
  <div class="summary">
    <span><strong id="summary-lines">0</strong> líneas</span>
    <span><strong id="summary-units">0</strong> unidades</span>
  </div>
  <div class="action-buttons">
    <button type="button" id="btn-clear" class="btn btn-ghost">Vaciar</button>
    <button type="button" id="btn-print" class="btn btn-secondary">Imprimir</button>
    <button type="button" id="btn-pdf" class="btn btn-primary">Generar PDF</button>
  </div>
</footer>

<div id="print-area" class="print-area"></div>

<script src="js/vendor/jspdf.umd.min.js"></script>
<script src="js/vendor/jspdf.plugin.autotable.min.js"></script>
<script src="js/catalog-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
