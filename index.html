<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Inventario de Pedidos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231b2f4b'/%3E%3Cpath d='M28 46l14 14 30-30' stroke='%2347d18c' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="app-header">
  <div class="app-header-inner">
    <span class="app-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
    </span>
    <div>
      <h1>Inventario de Pedidos</h1>
      <p class="app-subtitle">Marca lo que hay que pedir y genera el PDF para la sección de pedidos</p>
    </div>
  </div>
</header>

<section class="order-header">
  <button type="button" id="order-header-toggle" class="order-header-toggle">
    <span>Datos del pedido</span>
    <span class="chevron">›</span>
  </button>
  <div id="order-header-fields" class="order-header-fields">
    <div class="field field-fecha field-wide">
      <label for="f-fecha">Fecha</label>
      <input type="date" id="f-fecha">
    </div>
    <div class="field field-wide">
      <label for="f-solicitante">Solicitado por</label>
      <input type="text" id="f-solicitante" placeholder="Tu nombre">
    </div>
    <div class="field field-wide">
      <label for="f-observaciones">Observaciones</label>
      <textarea id="f-observaciones" rows="2" placeholder="Notas para el pedido (opcional)"></textarea>
    </div>
  </div>
</section>

<nav class="tab-bar">
  <button type="button" class="tab-btn active" data-tab="rieles">Guías y Rieles</button>
  <button type="button" class="tab-btn" data-tab="barras">Barras</button>
  <button type="button" class="tab-btn" data-tab="otros">Otros <span id="badge-otros" class="badge">0</span></button>
</nav>

<div class="toolbar">
  <div class="search-box">
    <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="search" id="search-input" placeholder="Buscar producto, color...">
  </div>
  <label class="check-label">
    <input type="checkbox" id="only-marked">
    Solo marcados
  </label>
</div>

<div id="tab-progress" class="progress-bar"><div id="tab-progress-fill" class="progress-fill"></div></div>

<main>
  <section id="panel-rieles" class="tab-panel active">
    <div id="panel-rieles-list" class="section-list"></div>
  </section>

  <section id="panel-barras" class="tab-panel">
    <div id="panel-barras-list" class="section-list"></div>
  </section>

  <section id="panel-otros" class="tab-panel">
    <form id="otro-form" class="otro-form">
      <input type="text" id="otro-cat" placeholder="Categoría (opcional)">
      <input type="text" id="otro-prod" placeholder="Producto *" required>
      <input type="text" id="otro-color" placeholder="Color (opcional)">
      <input type="number" id="otro-cant" placeholder="Cant." min="1">
      <button type="submit">Agregar</button>
    </form>
    <div id="otros-list" class="item-list"></div>
  </section>
</main>

<footer class="action-bar">
  <div class="summary">
    <span><strong id="summary-lines">0</strong> líneas</span>
    <span><strong id="summary-units">0</strong> unidades</span>
  </div>
  <div class="action-buttons">
    <button type="button" id="btn-clear" class="btn btn-ghost">Vaciar</button>
    <button type="button" id="btn-print" class="btn btn-secondary">Imprimir</button>
    <button type="button" id="btn-pdf" class="btn btn-primary">Generar PDF</button>
  </div>
</footer>

<div id="print-area" class="print-area"></div>

<script src="js/vendor/jspdf.umd.min.js"></script>
<script src="js/vendor/jspdf.plugin.autotable.min.js"></script>
<script src="js/catalog-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
