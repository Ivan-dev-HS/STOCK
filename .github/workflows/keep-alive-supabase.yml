name: Mantener activo Supabase

# Primer intento: un simple ping de lectura cada pocos días. No funcionó -
# el proyecto se pausó solo ~3 días después del último ping "exitoso", muy
# antes del plazo de inactividad que se supone lo dispara. Así que en vez
# de intentar EVITAR la pausa (no sabemos con certeza qué la dispara),
# este workflow la DETECTA y la DESHACE automáticamente, varias veces al
# día: si la API no responde, pide reactivar el proyecto directamente por
# la API de administración de Supabase. Así, como mucho, el proyecto queda
# inaccesible unas horas en vez de días hasta que alguien lo note.
on:
  schedule:
    - cron: '0 */6 * * *' # cada 6 horas
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar si el proyecto responde
        id: check
        run: |
          HTTP_CODE=$(curl -s -o /tmp/respuesta.json -w "%{http_code}" \
            "https://dgwroemrzptptoyuazzc.supabase.co/rest/v1/inv_weekly_reports?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          CURL_EXIT=$?
          if [ "$CURL_EXIT" -ne 0 ]; then HTTP_CODE="000"; fi
          echo "HTTP $HTTP_CODE (curl exit $CURL_EXIT)"
          cat /tmp/respuesta.json 2>/dev/null || true
          echo "code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
        env:
          # Misma "anon key" pública que ya usa la app (js/supabase-config.js).
          # No es secreta: el acceso real lo controlan las políticas RLS.
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnd3JvZW1yenB0cHRveXVhenpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3OTczNzQsImV4cCI6MjEwNDM3MzM3NH0.UE4lrLiJ48-C2HcTJdIiGbOSxrIAEjmOhOWlmqi-haE

      - name: Reactivar el proyecto si no respondió
        if: steps.check.outputs.code != '200'
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::El proyecto no respondió (HTTP ${{ steps.check.outputs.code }}) y falta el secret SUPABASE_ACCESS_TOKEN, así que no lo puedo reactivar automáticamente. Ver README para crearlo."
            exit 1
          fi
          echo "El proyecto no respondió (HTTP ${{ steps.check.outputs.code }}). Pidiendo reactivarlo..."
          HTTP_CODE=$(curl -s -o /tmp/restore.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/dgwroemrzptptoyuazzc/restore" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Restore HTTP $HTTP_CODE"
          cat /tmp/restore.json 2>/dev/null || true
          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::No se pudo pedir la reactivación (HTTP $HTTP_CODE)."
            exit 1
          fi
          echo "Reactivación solicitada. Tarda uno o dos minutos en terminar de arrancar."
        env:
          # Personal Access Token de Supabase (cuenta > Access Tokens), guardado
          # como secret del repo. A diferencia de la anon key, este SÍ es
          # sensible: da acceso de administración sobre los proyectos de la
          # cuenta. Ver README, sección "Evitar que Supabase se pause".
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
